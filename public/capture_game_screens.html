<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vortex Arena 3D In-Game Capture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; width: 1920px; height: 1080px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 1920px; height: 1080px; position: absolute; top: 0; left: 0; }
    #hud { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; pointer-events: none; }
    
    /* Crosshair */
    .crosshair {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 28px; height: 28px;
    }
    .crosshair::before, .crosshair::after {
      content: ''; position: absolute; background: rgba(0, 240, 255, 0.95);
      box-shadow: 0 0 6px #00f0ff;
    }
    .crosshair::before { top: 13px; left: 0; width: 28px; height: 2px; }
    .crosshair::after { top: 0; left: 13px; width: 2px; height: 28px; }
    .crosshair-center {
      position: absolute; top: 12px; left: 12px; width: 4px; height: 4px;
      background: #ff3366; border-radius: 50%; box-shadow: 0 0 8px #ff3366;
    }

    /* Top Left Status */
    .status-panel {
      position: absolute; top: 40px; left: 50px;
      background: rgba(10, 16, 28, 0.85); border: 1.5px solid rgba(0, 240, 255, 0.5);
      border-radius: 12px; padding: 18px 24px; width: 340px;
      backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .bar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .bar-label { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: 1.5px; }
    .bar-val { font-size: 18px; font-weight: 900; }
    .bar-track { width: 100%; height: 12px; background: rgba(255,255,255,0.12); border-radius: 6px; overflow: hidden; }
    .bar-fill-hp { height: 100%; width: 100%; background: linear-gradient(90deg, #00ff88, #00d26a); box-shadow: 0 0 12px #00ff88; }
    .bar-fill-shield { height: 100%; width: 75%; background: linear-gradient(90deg, #00e5ff, #0099ff); box-shadow: 0 0 12px #00e5ff; }

    /* Top Right Ammo */
    .ammo-panel {
      position: absolute; top: 40px; right: 50px; text-align: right;
      background: rgba(10, 16, 28, 0.85); border: 1.5px solid rgba(255, 183, 0, 0.5);
      border-radius: 12px; padding: 16px 28px; width: 340px;
      backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .weapon-name { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 1.5px; margin-bottom: 2px; }
    .ammo-counts { font-size: 46px; font-weight: 900; color: #ffb700; text-shadow: 0 0 16px rgba(255, 183, 0, 0.7); }
    .ammo-reserve { font-size: 22px; color: #94a3b8; font-weight: 700; }

    /* Match Banner */
    .match-banner {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 24px;
      background: rgba(10, 16, 28, 0.9); border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px; padding: 12px 36px;
      font-size: 22px; font-weight: 900; color: #fff; box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }
    .score-blue { color: #00e5ff; text-shadow: 0 0 12px #00e5ff; }
    .score-red { color: #ff3366; text-shadow: 0 0 12px #ff3366; }
    .timer { font-size: 20px; color: #ffb700; }

    /* Mobile Controls */
    .joystick-zone {
      position: absolute; bottom: 70px; left: 80px;
      width: 190px; height: 190px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.3);
      background: rgba(15, 23, 42, 0.45);
      display: flex; align-items: center; justify-content: center;
    }
    .joystick-knob {
      width: 86px; height: 86px; border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.9) 0%, rgba(0, 150, 255, 0.4) 100%);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
      border: 2.5px solid #00f0ff;
    }

    .fire-btn {
      position: absolute; bottom: 80px; right: 80px;
      width: 146px; height: 146px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 51, 102, 0.9) 0%, rgba(180, 20, 60, 0.5) 100%);
      border: 3.5px solid #ff3366;
      box-shadow: 0 0 30px rgba(255, 51, 102, 0.7);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; font-weight: 900; font-size: 24px; letter-spacing: 2px;
    }

    .action-btn-jump {
      position: absolute; bottom: 255px; right: 65px;
      width: 88px; height: 88px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.8); border: 2.5px solid rgba(0, 240, 255, 0.7);
      display: flex; align-items: center; justify-content: center;
      color: #00f0ff; font-weight: 900; font-size: 16px;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.3);
    }

    .action-btn-reload {
      position: absolute; bottom: 85px; right: 260px;
      width: 88px; height: 88px; border-radius: 50%;
      background: rgba(15, 23, 42, 0.8); border: 2.5px solid rgba(255, 183, 0, 0.7);
      display: flex; align-items: center; justify-content: center;
      color: #ffb700; font-weight: 900; font-size: 14px;
      box-shadow: 0 0 16px rgba(255, 183, 0, 0.3);
    }

    /* Killfeed */
    .killfeed {
      position: absolute; top: 170px; right: 50px;
      display: flex; flex-direction: column; gap: 8px; text-align: right;
    }
    .kill-msg {
      background: rgba(10, 16, 28, 0.8); border-left: 3.5px solid #00ff88;
      padding: 7px 16px; border-radius: 4px; font-size: 15px; font-weight: 800; color: #fff;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hud">
    <div class="crosshair"><div class="crosshair-center"></div></div>
    
    <div class="status-panel">
      <div class="bar-row">
        <span class="bar-label">HEALTH</span>
        <span class="bar-val" id="hud-hp-val" style="color: #00ff88;">100</span>
      </div>
      <div class="bar-track" style="margin-bottom: 12px;"><div class="bar-fill-hp" id="hud-hp-bar"></div></div>
      <div class="bar-row">
        <span class="bar-label">SHIELD</span>
        <span class="bar-val" id="hud-shield-val" style="color: #00e5ff;">75</span>
      </div>
      <div class="bar-track"><div class="bar-fill-shield" id="hud-shield-bar"></div></div>
    </div>

    <div class="match-banner">
      <span class="score-blue" id="hud-blue-score">BLUE 16</span>
      <span>:</span>
      <span class="score-red" id="hud-red-score">RED 14</span>
      <span style="opacity: 0.3;">|</span>
      <span class="timer" id="hud-timer">02:45</span>
    </div>

    <div class="ammo-panel">
      <div class="weapon-name" id="hud-weapon-name">V-44 STRIKER</div>
      <div><span class="ammo-counts" id="hud-ammo-cur">28</span> <span class="ammo-reserve" id="hud-ammo-res">/ 180</span></div>
    </div>

    <div class="killfeed" id="hud-killfeed">
      <div class="kill-msg"><span style="color:#00e5ff;">You</span> [V-44 Striker] <span style="color:#ff3366;">Bot_Ghost</span></div>
      <div class="kill-msg"><span style="color:#00e5ff;">Player_Alpha</span> [Hawk-50] <span style="color:#ff3366;">Bot_Viper</span></div>
    </div>

    <div class="joystick-zone"><div class="joystick-knob"></div></div>
    <div class="fire-btn">FIRE</div>
    <div class="action-btn-jump">JUMP</div>
    <div class="action-btn-reload">RELOAD</div>
  </div>

  <script type="module">
    import * as THREE from './vendor/three/three.module.js';
    import { MapBuilder } from './js/game/MapBuilder.js';
    import { WeaponViewModel } from './js/game/WeaponViewModel.js';
    import { PlayerModel } from './js/game/PlayerModel.js';

    const params = new URLSearchParams(window.location.search);
    const screenNum = parseInt(params.get('screen') || '1', 10);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(72, 1920 / 1080, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1920, 1080);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    let mapId = 'sector7';
    let weaponId = 'assault_rifle';
    let skyColor = 0x0e1726;

    if (screenNum === 1) {
      // 1. Sector-7 Sci-Fi Compound
      mapId = 'sector7';
      weaponId = 'assault_rifle';
      skyColor = 0x0c1322;
      scene.fog = new THREE.FogExp2(skyColor, 0.012);

      camera.position.set(0, 1.8, 12);
      camera.lookAt(0, 1.8, 0);

      document.getElementById('hud-weapon-name').innerText = 'V-44 STRIKER';
      document.getElementById('hud-ammo-cur').innerText = '28';
      document.getElementById('hud-ammo-res').innerText = '/ 180';
      document.getElementById('hud-blue-score').innerText = 'BLUE 16';
      document.getElementById('hud-red-score').innerText = 'RED 14';
      document.getElementById('hud-timer').innerText = '02:45';

      const bot1 = new PlayerModel({
        id: 'bot_1', username: 'Bot_Reaper', team: 'red',
        characterSkin: { color_primary: '#dc2626', color_secondary: '#1f2937', color_accent: '#ef4444' }
      });
      bot1.group.position.set(1.6, 0, 3.5);
      bot1.group.rotation.y = Math.PI - 0.2;
      scene.add(bot1.group);

      const bot2 = new PlayerModel({
        id: 'bot_2', username: 'Bot_Ghost', team: 'red',
        characterSkin: { color_primary: '#475569', color_secondary: '#0f172a', color_accent: '#ff0055' }
      });
      bot2.group.position.set(-3.2, 0, -1.0);
      bot2.group.rotation.y = Math.PI + 0.3;
      scene.add(bot2.group);

    } else if (screenNum === 2) {
      // 2. Suburban Estate & Courtyard (Sniper)
      mapId = 'house';
      weaponId = 'sniper_rifle';
      skyColor = 0x82b1ff;
      scene.fog = new THREE.FogExp2(0x82b1ff, 0.007);

      camera.position.set(0, 2.2, 24);
      camera.lookAt(0, 2.2, 0);

      document.getElementById('hud-weapon-name').innerText = 'HAWK-50 SNIPER';
      document.getElementById('hud-ammo-cur').innerText = '5';
      document.getElementById('hud-ammo-res').innerText = '/ 25';
      document.getElementById('hud-blue-score').innerText = 'BLUE 20';
      document.getElementById('hud-red-score').innerText = 'RED 17';
      document.getElementById('hud-timer').innerText = '01:15';
      document.getElementById('hud-hp-val').innerText = '85';
      document.getElementById('hud-hp-bar').style.width = '85%';
      document.getElementById('hud-shield-val').innerText = '100';
      document.getElementById('hud-shield-bar').style.width = '100%';

      document.getElementById('hud-killfeed').innerHTML = `
        <div class="kill-msg"><span style="color:#00e5ff;">You</span> [Hawk-50 🎯] <span style="color:#ff3366;">Bot_Spectre</span></div>
        <div class="kill-msg"><span style="color:#00e5ff;">Player_Alpha</span> [Breacher-12] <span style="color:#ff3366;">Bot_Hunter</span></div>
      `;

      const bot1 = new PlayerModel({
        id: 'bot_s1', username: 'Bot_Viper', team: 'red',
        characterSkin: { color_primary: '#991b1b', color_secondary: '#18181b', color_accent: '#f43f5e' }
      });
      bot1.group.position.set(1.2, 0, 8.0);
      bot1.group.rotation.y = Math.PI - 0.2;
      scene.add(bot1.group);

    } else if (screenNum === 3) {
      // 3. Golden Valley Farm (Shotgun)
      mapId = 'farm';
      weaponId = 'shotgun';
      skyColor = 0xd97706;
      scene.fog = new THREE.FogExp2(0xd97706, 0.009);

      camera.position.set(6, 2.2, 20);
      camera.lookAt(-4, 2.0, 0);

      document.getElementById('hud-weapon-name').innerText = 'BREACHER-12 SHOTGUN';
      document.getElementById('hud-ammo-cur').innerText = '8';
      document.getElementById('hud-ammo-res').innerText = '/ 32';
      document.getElementById('hud-blue-score').innerText = 'BLUE 8';
      document.getElementById('hud-red-score').innerText = 'RED 9';
      document.getElementById('hud-timer').innerText = '04:10';
      document.getElementById('hud-hp-val').innerText = '65';
      document.getElementById('hud-hp-bar').style.width = '65%';
      document.getElementById('hud-shield-val').innerText = '40';
      document.getElementById('hud-shield-bar').style.width = '40%';

      document.getElementById('hud-killfeed').innerHTML = `
        <div class="kill-msg"><span style="color:#00e5ff;">You</span> [Breacher-12] <span style="color:#ff3366;">Bot_Brute</span></div>
      `;

      const bot1 = new PlayerModel({
        id: 'bot_f1', username: 'Bot_Outlaw', team: 'red',
        characterSkin: { color_primary: '#b45309', color_secondary: '#27272a', color_accent: '#f59e0b' }
      });
      bot1.group.position.set(-1.0, 0, 7.0);
      bot1.group.rotation.y = Math.PI - 0.1;
      scene.add(bot1.group);

    } else if (screenNum === 4) {
      // 4. Whispering Pines Forest (Assault Rifle)
      mapId = 'forest';
      weaponId = 'assault_rifle';
      skyColor = 0x334155;
      scene.fog = new THREE.FogExp2(0x334155, 0.012);

      camera.position.set(0, 2.0, 20);
      camera.lookAt(0, 2.0, 0);

      document.getElementById('hud-weapon-name').innerText = 'V-44 STRIKER';
      document.getElementById('hud-ammo-cur').innerText = '30';
      document.getElementById('hud-ammo-res').innerText = '/ 150';
      document.getElementById('hud-blue-score').innerText = 'BLUE 24';
      document.getElementById('hud-red-score').innerText = 'RED 21';
      document.getElementById('hud-timer').innerText = '00:48';

      document.getElementById('hud-killfeed').innerHTML = `
        <div class="kill-msg"><span style="color:#00e5ff;">Mobile_Player</span> [V-44 Striker] <span style="color:#ff3366;">Bot_Wolf</span></div>
        <div class="kill-msg"><span style="color:#00e5ff;">You</span> [V-44 Striker] <span style="color:#ff3366;">Bot_Titan</span></div>
      `;

      const bot1 = new PlayerModel({
        id: 'bot_fo1', username: 'Bot_Wolf', team: 'red',
        characterSkin: { color_primary: '#15803d', color_secondary: '#1c1917', color_accent: '#22c55e' }
      });
      bot1.group.position.set(1.5, 0, 6.0);
      bot1.group.rotation.y = Math.PI - 0.3;
      scene.add(bot1.group);

      const bot2 = new PlayerModel({
        id: 'bot_fo2', username: 'Bot_Titan', team: 'red',
        characterSkin: { color_primary: '#7c3aed', color_secondary: '#1e1b4b', color_accent: '#a855f7' }
      });
      bot2.group.position.set(-3.2, 0, 2.0);
      bot2.group.rotation.y = Math.PI + 0.2;
      scene.add(bot2.group);

    } else {
      // 5. S.S. Oceanic Cruise Ship (Pistol)
      mapId = 'cruise';
      weaponId = 'pistol';
      skyColor = 0x38bdf8;
      scene.fog = new THREE.FogExp2(0x38bdf8, 0.005);

      camera.position.set(0, 6.5, 24);
      camera.lookAt(0, 4.0, 0);

      document.getElementById('hud-weapon-name').innerText = 'PULSE-9 SIDEARM';
      document.getElementById('hud-ammo-cur').innerText = '15';
      document.getElementById('hud-ammo-res').innerText = '/ 90';
      document.getElementById('hud-blue-score').innerText = 'BLUE 11';
      document.getElementById('hud-red-score').innerText = 'RED 7';
      document.getElementById('hud-timer').innerText = '03:02';

      document.getElementById('hud-killfeed').innerHTML = `
        <div class="kill-msg"><span style="color:#00e5ff;">You</span> [Pulse-9] <span style="color:#ff3366;">Bot_Marine</span></div>
        <div class="kill-msg"><span style="color:#ff3366;">Bot_Corsair</span> [V-44 Striker] <span style="color:#00e5ff;">Teammate_Echo</span></div>
      `;

      const bot1 = new PlayerModel({
        id: 'bot_c1', username: 'Bot_Corsair', team: 'red',
        characterSkin: { color_primary: '#0369a1', color_secondary: '#0f172a', color_accent: '#38bdf8' }
      });
      bot1.group.position.set(1.8, 4.0, 8.0);
      bot1.group.rotation.y = Math.PI - 0.2;
      scene.add(bot1.group);
    }

    scene.background = new THREE.Color(skyColor);

    // Common Ambient & Key Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x334155, 1.1);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.8);
    sun.position.set(30, 50, 25);
    sun.castShadow = true;
    scene.add(sun);

    // Fill light from behind camera to illuminate weapon viewmodel
    const camFill = new THREE.DirectionalLight(0xffffff, 1.4);
    camFill.position.set(0, 10, 20);
    scene.add(camFill);

    // Build the 3D map environment
    MapBuilder.buildMap(scene, mapId);

    // Weapon ViewModel
    const weaponModel = new WeaponViewModel(camera);
    weaponModel.switchWeapon(weaponId);
    scene.add(camera);

    // Warm up weapon position lerp
    for (let i = 0; i < 40; i++) {
      weaponModel.update(0.05);
    }

    renderer.render(scene, camera);
    window.__RENDER_READY__ = true;
  </script>
</body>
</html>
